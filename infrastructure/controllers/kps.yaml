apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kps
  namespace: monitoring
spec:
  interval: 30m
  releaseName: kps
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "87.21.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: kps-secrets
  values:
    prometheus:
      prometheusSpec:
        retention: 7d
        retentionSize: 1600MB
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi

        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ebs-gp3-retain
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi

      ingress:
        enabled: true
        ingressClassName: cilium
        hosts:
          - home.prometheus
        paths:
          - /
        pathType: Prefix

    grafana:
      deploymentStrategy:
        type: Recreate
      persistence:
        enabled: true
        storageClassName: ebs-gp3-retain
        size: 1Gi

      ingress:
        enabled: true
        ingressClassName: cilium
        hosts:
          - home.grafana
        path: /
        pathType: Prefix

    alertmanager:
      ingress:
        enabled: false
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ebs-gp3-retain
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 256Mi
      config:
        route:
          receiver: 'discord'
          group_by: ['alertname', 'namespace']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h

    kubeProxy:
      enabled: false


